[package]
name = "app-access-locker"
version = "0.1.0"
edition = "2021"
authors = ["Ricardo Aguilar"]
description = "Native App Locker for Fedora 44"

[dependencies]
gtk4 = { version = "0.7", package = "gtk4" }
libadwaita = "0.5"
argon2 = "0.5"
keyring = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
rand_core = { version = "0.6", features = ["getrandom"] }
# Modo Autenticador (visión computacional)
linuxvideo = "0.3"
tract-onnx = "0.23"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# La inferencia en debug es muy lenta; optimizamos las dependencias siempre.
[profile.dev.package."*"]
opt-level = 3
